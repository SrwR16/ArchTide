# ~/.config/mpv/input.conf

UP add volume 5
DOWN add volume -5
RIGHT seek 5
LEFT seek -5
SPACE cycle pause
F cycle fullscreen
. frame-step
, frame-back-step
Shift+S screenshot
W cycle sub
] add speed 0.1
[ add speed -0.1
I cycle interpolation

Ctrl+UP add video-zoom 0.2
Ctrl+DOWN add video-zoom -0.2
Alt+LEFT add video-pan-x -0.05
Alt+RIGHT add video-pan-x 0.05
Alt+UP add video-pan-y -0.05
Alt+DOWN add video-pan-y 0.05
Shift+RIGHT playlist-next
Shift+LEFT playlist-prev

# --- Anime4K upscaling toggle (off by default, only turn on when a video needs it) ---
# S-tier CNNs = smallest/fastest, meant for weak/integrated GPUs.
# Watch Shift+I stats (frame timing) after enabling to confirm no dropped frames.
Ctrl+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_S.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl"; show-text "Anime4K: iGPU Fast (Mode A)"
Ctrl+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_S.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl"; show-text "Anime4K: iGPU Fast (Mode C - denoise, for real bad rips)"
Ctrl+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: Off"
