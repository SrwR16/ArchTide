# ~/.config/mpv/mpv.conf
# Tuned for integrated GPU: good quality upscaling without heavy pressure.
# See input.conf for the Anime4K toggle (Ctrl+1 / Ctrl+0) - off by default,
# turn it on only for videos that actually need the upscale.

vo=gpu-next
gpu-api=vulkan          # gpu-next runs on libplacebo; vulkan gets you the full feature set
hwdec=auto-safe
vulkan-async-transfer=yes     # async transfers/compute offload - keeps the render queue fed on iGPU
vulkan-async-compute=yes
gpu-shader-cache-dir=~~/.cache    # reuse compiled shaders across runs (fast startup)

# COLOR MANAGEMENT
icc-profile-auto        # respects your DE's configured monitor color profile if one exists.
                         # harmless no-op if you haven't calibrated your display - zero GPU cost either way.

# SYNC & MOTION
video-sync=display-resample   # smooth frame timing; required for the I (interpolation) toggle
tscale=oversample             # used only when interpolation is toggled on with I
interpolation=no              # left off on purpose - real cost, skip it on iGPU; press I to enable

# SCALING (this is your main "upscale quality" lever without external shaders)
scale=ewa_lanczossharp  # luma - the one that matters visually, worth the cost
cscale=spline36         # chroma - eyes barely notice, EWA here is wasted GPU cycles
dscale=mitchell         # anti-ringing downscale, best for shrinking (better than spline36)
sigmoid-upscaling=yes
scale-clamp=0.0
scale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
scaler-resizes-only=yes   # only run scalers when the frame actually changes size - free perf win

# DEBANDING
deband=yes
deband-iterations=1
deband-threshold=28
deband-range=16
deband-grain=4           # was 32 in the old config - that's "badly mastered DVD" territory,
                          # on normal sources it just adds visible noise. Raise it only
                          # for genuinely bad streams.

# DITHERING
dither=fruit
dither-depth=16
dither-size-fruit=8
temporal-dither=yes
temporal-dither-period=4

# CACHE
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB

# HDR & TONE MAPPING (BT.2390 / ACES-like filmic)
hdr-compute-peak=yes
hdr-peak-percentile=99.8
hdr-contrast-recovery=0.0
tone-mapping=spline
tone-mapping-param=0.0
target-colorspace-hint=yes
gamut-mapping-mode=perceptual
target-peak=auto

# AUDIO
ao=pipewire              # if you're on pipewire (default on most Arch installs now),
                          # this is lower-latency than going through pulse compat.
                          # if you're actually on plain pulseaudio, use ao=pulse instead.
audio-exclusive=no
audio-channels=auto
volume-max=130
gapless-audio=yes
audio-pitch-correction=yes
audio-normalize-downmix=yes
audio-buffer=0.4

# YTDL
ytdl-format=bestvideo[height<=2160]+bestaudio/best
ytdl-raw-options=yes-playlist=yes,format-sort=res

# OSC & UI (material-osc replaces the default OSC, see script-opts/material-osc.conf)
osc=no
osd-bar=no

# PLAYBACK
save-position-on-quit=yes
keep-open=yes
slang=eng,en
alang=jpn,jp,eng,en
sub-auto=fuzzy

# SEEKING
hr-seek=yes
hr-seek-framedrop=no
force-seekable=yes

# SUBTITLE DEFAULTS
osd-font=Inter          # material-osc UI + OSD text render with this font
sub-font=Inter Light    # was Segoe UI Light - not installed here, was silently falling back to Noto Sans
sub-font-size=60
sub-color="#ffff00"
sub-border-size=1.0
sub-outline-color="#ff0000"
sub-shadow-color="#000000"
sub-shadow-offset=0.5
sub-blur=0.0
sub-back-color="#00000000"
sub-fix-timing=yes
blend-subtitles=yes
sub-clear-on-seek=yes
