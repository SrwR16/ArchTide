# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use zsh shell
shell /usr/bin/zsh

# Copy
map ctrl+c    copy_or_interrupt

# ── zsh-edit-select ──────────────────────────────────────────
# Copy: Ctrl+Shift+C sends the escape sequence to zsh
map ctrl+shift+c send_text all \x1b[67;6u

# Paste: Ctrl+Shift+V
map ctrl+shift+v send_text all \x1b[86;6u

# Redo: Ctrl+Shift+Z
map ctrl+shift+z send_text all \x1b[90;6u

# Selection: pass Shift and Ctrl+Shift keys through to zsh
map shift+left        no_op
map shift+right       no_op
map shift+up          no_op
map shift+down        no_op
map shift+home        no_op
map shift+end         no_op
map ctrl+shift+left   no_op
map ctrl+shift+right  no_op
map ctrl+shift+home   no_op
map ctrl+shift+end    no_op

# <> keys: Shift+, / Shift+. → Ctrl+Left / Ctrl+Right (word navigation)
map shift+comma    send_text all \x1b[1;5D
map shift+period   send_text all \x1b[1;5C

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
background_opacity 0.85
background_opacity 0.80
